# ==========================================================================
# OdontoSaaS — pre-commit hooks
# Instalar:  pre-commit install
# Rodar em tudo:  pre-commit run --all-files
# ==========================================================================
minimum_pre_commit_version: "3.5.0"

repos:
  # --- Ruff: lint (com --fix) e format ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4                     # manter alinhado ao requirements/dev.txt
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  # --- Hooks utilitários ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'            # Markdown pode usar espaços em fim de linha
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
