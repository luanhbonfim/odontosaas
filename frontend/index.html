<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-1-removebg-preview.png" />
    <link rel="apple-touch-icon" href="/logo-1-removebg-preview.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PróClínica</title>
    <script>
      // Aplica o tema ANTES do React montar (evita o "flash" claro no tema escuro).
      // Sem preferência salva, segue o sistema (prefers-color-scheme).
      try {
        var salvo = JSON.parse(localStorage.getItem("odonto-tema") || "null");
        var tema = salvo && salvo.state && salvo.state.tema;
        if (!tema) tema = matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        if (tema === "escuro") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
