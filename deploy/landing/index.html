<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProClínica — em breve</title>
    <meta name="description" content="ProClínica — gestão inteligente para clínicas odontológicas. Em breve." />
    <style>
      :root {
        --bg1: #0e7490;
        --bg2: #0891b2;
        --ink: #0f172a;
        --muted: #475569;
        --card: rgba(255, 255, 255, 0.96);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--ink);
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--card);
        width: 100%; max-width: 460px;
        border-radius: 20px;
        padding: 44px 36px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
      .logo {
        width: 68px; height: 68px; margin: 0 auto 20px;
        display: flex; align-items: center; justify-content: center;
        font-size: 34px;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        border-radius: 18px;
      }
      h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.02em; }
      .tag { margin: 0 0 24px; color: var(--muted); font-size: 15px; }
      .badge {
        display: inline-block;
        padding: 8px 18px; border-radius: 999px;
        font-weight: 600; font-size: 14px;
        color: #0e7490;
        background: #ecfeff; border: 1px solid #a5f3fc;
      }
      .foot { margin-top: 28px; font-size: 13px; color: var(--muted); }
      .foot a { color: #0e7490; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">🦷</div>
      <h1>ProClínica</h1>
      <p class="tag">Gestão inteligente para clínicas odontológicas.</p>
      <span class="badge">🚧 Site em breve</span>
      <p class="foot">Já é cliente? Acesse pelo endereço da sua clínica.</p>
    </main>
  </body>
</html>
