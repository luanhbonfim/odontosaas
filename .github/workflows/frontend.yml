name: Frontend CI

# Gatilhos: push nas branches principais e Pull Requests, apenas quando algo
# em frontend/ (ou este próprio workflow) muda — evita rodar à toa em mudanças
# só de backend.
on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# Cancela execuções anteriores do mesmo ref quando chega um novo push.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  # Pipeline do frontend: lint → typecheck → test → build.
  # Executa tudo num job só (etapas rápidas, compartilham o mesmo node_modules).
  # ------------------------------------------------------------------------
  frontend:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 8 exige Node >= 20.19 / 22.12; usamos a LTS 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        # npm ci respeita o frontend/.npmrc (legacy-peer-deps=true).
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm run test

      - name: Build de produção (tsc + vite build)
        run: npm run build
