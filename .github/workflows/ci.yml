name: CI

# Gatilhos: todo push nas branches principais e toda Pull Request.
on:
  push:
    branches: [main, develop]
  pull_request:

# Cancela execuções anteriores do mesmo ref quando chega um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------
  # Lint — ruff (verificação de estilo/erros) + checagem de formatação.
  # O job de TESTES (pytest + coverage, com postgres:16 e redis:7) será
  # adicionado na próxima tarefa do bloco CI/CD.
  # ------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        # Mesma versão pinada em requirements/dev.txt e no .pre-commit-config.yaml
        run: pip install ruff==0.8.4

      - name: ruff check (lint)
        run: ruff check --output-format=github .

      - name: ruff format (checagem)
        run: ruff format --check .

  # ------------------------------------------------------------------------
  # Testes — pytest + coverage, com Postgres 16 e Redis 7 reais (services).
  # O limiar mínimo de cobertura (--cov-fail-under) entra na próxima tarefa.
  # ------------------------------------------------------------------------
  test:
    name: Testes (pytest + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: odonto
          POSTGRES_USER: odonto
          POSTGRES_PASSWORD: odonto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odonto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-secret-key-nao-usar-em-producao
      FIELD_ENCRYPTION_KEY: 7bfL4XTjSO_rOvwylRpwinUaaB-e2N_Q4mQG2eV8-68=
      DATABASE_URL: postgres://odonto:odonto@localhost:5432/odonto
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Rodar testes com cobertura
        run: pytest --cov --cov-report=term-missing

  # ------------------------------------------------------------------------
  # Build da imagem Docker de produção — apenas em push na main ou em tags,
  # e somente se lint + testes passarem. Build-only (não publica).
  # Para publicar no GHCR: adicionar `permissions: packages: write`, um step
  # docker/login-action e trocar `push: false` por `push: true` + tags do
  # registry (ex.: ghcr.io/<org>/odonto-web:latest).
  # ------------------------------------------------------------------------
  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem de produção
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: odonto-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
